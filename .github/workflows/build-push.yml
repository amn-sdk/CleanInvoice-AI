name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: saddika

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for images
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Core API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/core-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-core-api:${{ steps.meta.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-core-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Services
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-services
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-ai-service:${{ steps.meta.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-frontend:${{ steps.meta.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Core API: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-core-api:${{ steps.meta.outputs.TAG }}"
          echo "AI Service: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-ai-service:${{ steps.meta.outputs.TAG }}"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cleaninvoice-frontend:${{ steps.meta.outputs.TAG }}"
