name: CI - Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core API dependencies
        working-directory: apps/core-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Core API tests
        working-directory: apps/core-api
        run: |
          pytest --cov=app --cov-report=term-missing || echo "No tests found, skipping"

  ai-service-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Services dependencies
        working-directory: apps/ai-services
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run AI Services tests
        working-directory: apps/ai-services
        run: |
          pytest --cov=app --cov-report=term-missing || echo "No tests found, skipping"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend dependencies
        working-directory: apps/web
        run: |
          rm -rf node_modules .next
          npm ci

      - name: Run Frontend linting
        working-directory: apps/web
        run: npm run lint || echo "Linting disabled"

      - name: Build Frontend
        working-directory: apps/web
        run: npm run build
